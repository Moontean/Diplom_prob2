<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Preview Overlay</title>
    <link rel="stylesheet" href="/css/tailwind.css">
    <style>
        html,
        body {
            background: #f8fafc;
            height: 100%;
            margin: 0;
        }

        #pages {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 0;
            width: 100%;
            max-width: 100%;
        }

        .page-wrap {
            position: relative;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }

        .overlay-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .field {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            color: #111827;
            font-family: Inter, system-ui, Arial, sans-serif;
            white-space: nowrap;
            pointer-events: auto;
        }

        .hint {
            position: fixed;
            right: 12px;
            top: 12px;
            background: #0f172a;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            opacity: .85;
        }
    </style>
    <!-- Tailwind CDN fallback был удалён, чтобы избежать предупреждений в продакшене -->
    <!-- PDF.js (UMD), html2canvas, jsPDF -->
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <script>
        if (window && window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>

<body>
    <div class="hint">PDF предпросмотр с оверлеями</div>
    <div id="pages"></div>

    <script>
        /* ========== SOLUTION 3 (reducible) ==========
         * Уменьшенная маска для сохранения цветной шапки резюме.
         * Изменения: state.maskPadX/Y, maskHeightFactor; drawPlaceholderValues; exportStrictHtmlVector.
         * Если не поможет — откатить и реализовать SOLUTION 1 (цвет текста из PDF operator list в pdfStructureParser).
         * ========================================== */
        var state = {
            src: null,
            pages: [],
            overlays: [],
            scale: 1.5,
            cvData: null,
            displayScale: 1.4,
            useSvg: false,
            updatingOverlays: false,
            pendingOverlayUpdate: false,
            suspendRender: false,
            // Параметры маски для зачистки фона от текста
            // --- SOLUTION 3 (reducible): уменьшенная маска, чтобы не перекрывать цветную шапку ---
            // Если не поможет — откатить и реализовать SOLUTION 1 (цвет текста из PDF operator list)
            maskPadX: 2,
            maskPadY: 2,
            maskHeightFactor: 1.2,
            maskBaselineTol: 0.25,
            maskDebug: false
        };

        function getParam(name) { var url = new URL(window.location.href); return url.searchParams.get(name); }

        function mapValue(key, data) {
            if (!data) return '';
            var p = data.personalInfo || {};
            var up = function (s) { return (s || '').toString(); };
            switch (key) {
                case 'FIRSTNAME': return up(p['given-name'] || p.givenName || p.firstName);
                case 'LASTNAME': return up(p['family-name'] || p.familyName || p.lastName);
                case 'JOBTITLE': return up(p['job-position'] || p.jobPosition);
                case 'EMAIL': return up(p.email);
                case 'PHONE': return up(p.phone);
                case 'ADDRESS': return up(p.address);
                case 'CITY': return up(p.city);
                case 'WEBSITE': return up(p.website);
                case 'LINKEDIN': return up(p.linkedin);
                case 'BIRTHDATE': return up(p.birthdate);
                case 'SUMMARY': return up(p.summary || (data.additionalSections && data.additionalSections.profile));
                case 'SKILLS': {
                    var arr = Array.isArray(data.skills) ? data.skills : [];
                    return arr.map(function (s) { return s.skill || s.name; }).filter(Boolean).join(', ');
                }
                default: return '';
            }
        }

        function escapeXml(val) {
            return String(val || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function replacePlaceholdersInSvg(svgText) {
            if (!svgText || typeof svgText !== 'string') return svgText;
            return svgText.replace(/\{\{\s*([A-Z0-9_]+)\s*\}\}/g, function (_m, key) {
                var v = mapValue(key, state.cvData);
                return escapeXml(v);
            });
        }

        function detectPlaceholderKey(raw, counters) {
            if (!raw) return null;
            var m = raw.match(/\{\{\s*([A-Z0-9_]+)\s*\}\}/);
            if (m && m[1]) return m[1];
            var s = String(raw).trim();
            if (/^[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}$/.test(s)) return 'EMAIL';
            if (/^(\+?\d[\d\s().-]{6,})$/.test(s)) return 'PHONE';
            if (/linkedin\.com/i.test(s)) return 'LINKEDIN';
            if (/https?:\/\//i.test(s)) return 'WEBSITE';
            if (/^\d{5,6}$/.test(s)) return 'ZIP';
            // Fallback counter-based placeholder
            counters.text = counters.text + 1;
            return 'TEXT_' + counters.text;
        }

        function extractPlaceholderMatches(textContent) {
            var items = (textContent && textContent.items) || [];
            var matches = [];
            var re = /\{\{\s*([A-Z0-9_]+)\s*\}\}/g;
            for (var k = 0; k < items.length; k++) {
                var it = items[k];
                var str = String(it.str || it.text || '');
                var m;
                while ((m = re.exec(str)) !== null) {
                    var key = m[1];
                    var tf = it.transform || [1, 0, 0, 1, 0, 0];
                    var a = tf[0], b = tf[1], d = tf[3], e = tf[4], f = tf[5];
                    var fontSize = Math.max(10, Math.hypot(a, b) || Math.abs(d) || 12);
                    var width = (it.width || (str.length * fontSize * 0.62));
                    matches.push({ key: key, x: e, y: f, width: width, fontSize: fontSize });
                }
            }
            return matches;
        }

        function drawPlaceholderValues(ctx, viewport, matches) {
            if (!ctx || !matches || !matches.length) return;
            ctx.save();
            ctx.textBaseline = 'alphabetic';
            ctx.fillStyle = '#111827';

            // --- SOLUTION 3: уменьшенная маска (было: -2, +6, +4, 1.45) — меньше перекрывает цветной фон ---
            var pad = (state.maskPadX !== undefined ? state.maskPadX : 2);
            var hFactor = (state.maskHeightFactor !== undefined ? state.maskHeightFactor : 1.2);

            for (var i = 0; i < matches.length; i++) {
                var item = matches[i];
                var value = mapValue(item.key, state.cvData) || '';
                var fontSize = Math.max(10, item.fontSize);
                var x = item.x;
                var y = item.y;
                var textWidth = Math.max(item.width || 1, value.length * fontSize * 0.58);
                var maskX = x - pad;
                var maskY = (viewport.height - y) - (fontSize * 0.92) - pad;
                var maskH = Math.max(10, fontSize * hFactor);

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(maskX, maskY, textWidth + pad * 2, maskH + pad);

                ctx.fillStyle = '#111827';
                ctx.font = fontSize + 'px Inter, system-ui, Arial, sans-serif';
                ctx.fillText(value, x, viewport.height - y);
            }

            ctx.restore();
        }

        async function renderPageWithPlaceholders(p) {
            console.log('[renderPageWithPlaceholders] Start, has renderPromise:', !!p.renderPromise);
            if (state.suspendRender) {
                console.log('[renderPageWithPlaceholders] Skipped because suspendRender=true');
                return;
            }
            if (!p || !p.canvas || !p.page || !p.viewport) {
                console.warn('[renderPageWithPlaceholders] Missing required properties');
                return;
            }
            if (p.renderPromise) {
                console.log('[renderPageWithPlaceholders] Already rendering, waiting with timeout...');
                p.needsRerender = true;
                try {
                    await Promise.race([
                        p.renderPromise,
                        new Promise((_, reject) => setTimeout(() => reject(new Error('Render timeout')), 5000))
                    ]);
                    console.log('[renderPageWithPlaceholders] Previous render complete');
                    return;
                } catch (err) {
                    console.warn('[renderPageWithPlaceholders] Wait failed:', err.message);
                    if (state.suspendRender) {
                        console.log('[renderPageWithPlaceholders] Abort wait because suspendRender=true');
                        return;
                    }
                    // Отменяем активный renderTask перед сбросом промиса
                    if (p.renderTask) {
                        console.log('[renderPageWithPlaceholders] Cancelling active renderTask');
                        try {
                            p.renderTask.cancel();
                            await p.renderTask.promise.catch(() => { });
                        } catch (_) { }
                        p.renderTask = null;
                    }
                    p.renderPromise = null;
                    // Подождем немного, чтобы canvas освободился
                    await new Promise(resolve => setTimeout(resolve, 100));
                }
            }

            p.renderPromise = (async function run() {
                var iteration = 0;
                var maxIterations = 3;
                do {
                    console.log('[renderPageWithPlaceholders] Render loop iteration:', iteration, 'needsRerender:', p.needsRerender);
                    p.needsRerender = false;
                    iteration++;

                    if (iteration > maxIterations) {
                        console.warn('[renderPageWithPlaceholders] Max iterations reached');
                        break;
                    }

                    var ctx = p.canvas.getContext('2d');
                    console.log('[renderPageWithPlaceholders] Starting page.render()');
                    var task = p.page.render({ canvasContext: ctx, viewport: p.viewport });
                    p.renderTask = task;
                    try {
                        await task.promise;
                        console.log('[renderPageWithPlaceholders] page.render() complete');
                    } catch (err) {
                        console.warn('[renderPageWithPlaceholders] Render error:', err?.message || err?.name || String(err), err);
                        var isCancelled = !!(err && (err.name === 'RenderingCancelledException' || /Rendering cancelled/i.test(err.message || '')));
                        if (!isCancelled) throw err;
                        console.log('[renderPageWithPlaceholders] Render was cancelled (expected), continue');
                    } finally {
                        p.renderTask = null;
                    }
                    if (!p.matches || !p.matches.length) {
                        console.log('[renderPageWithPlaceholders] Extracting text content');
                        try {
                            var tc = await p.page.getTextContent();
                            p.matches = extractPlaceholderMatches(tc);
                            console.log('[renderPageWithPlaceholders] Extracted matches:', p.matches?.length || 0);
                        } catch (err) {
                            console.error('[renderPageWithPlaceholders] Text extraction error:', err?.message || String(err), err);
                            p.matches = [];
                        }
                    }
                    console.log('[renderPageWithPlaceholders] Drawing placeholder values');
                    drawPlaceholderValues(ctx, p.viewport, p.matches);
                } while (p.needsRerender && iteration < maxIterations);
                console.log('[renderPageWithPlaceholders] Render loop complete');
            })();

            try {
                await p.renderPromise;
                console.log('[renderPageWithPlaceholders] Main promise resolved');
            } finally {
                p.renderPromise = null;
            }
        }

        async function renderPdf() {
            var src = state.src;
            if (!src || !window.pdfjsLib) return;
            var container = document.getElementById('pages');
            container.innerHTML = '';
            state.pages = []; state.overlays = [];
            var loadingTask = window.pdfjsLib.getDocument(src);
            var pdf = await loadingTask.promise;
            var total = pdf.numPages;

            // Display scaling (CSS transform) for visual zoom independent of PDF render scale
            var vscaleParam = parseFloat(getParam('vscale') || '');
            var vfitParam = getParam('vfit') || 'width'; // default to width
            if (!isNaN(vscaleParam) && vscaleParam > 0) {
                state.displayScale = vscaleParam;
            } else if (vfitParam === 'width') {
                try {
                    var first = await pdf.getPage(1);
                    var base = first.getViewport({ scale: state.scale });
                    var rect = container.getBoundingClientRect();
                    var avail = (rect && rect.width ? rect.width : window.innerWidth || base.width);
                    state.displayScale = Math.max(0.8, Math.min(3.5, avail / base.width));
                } catch (e) { state.displayScale = 1; }
            } else {
                state.displayScale = 1;
            }
            // Графический режим: по умолчанию PNG (SVG можно включить через &gfx=svg)
            var gfxParam = (getParam('gfx') || '').toLowerCase();
            state.useSvg = gfxParam === 'svg';
            for (var n = 1; n <= total; n++) {
                var page = await pdf.getPage(n);
                var viewport = page.getViewport({ scale: state.scale });
                var pageWrap = document.createElement('div');
                pageWrap.className = 'page-wrap';
                pageWrap.style.width = viewport.width + 'px';
                pageWrap.style.height = viewport.height + 'px';
                pageWrap.style.transform = 'scale(' + state.displayScale + ')';
                pageWrap.style.transformOrigin = 'top left';

                // Frame to reserve scaled space so layout matches visual scale
                var frame = document.createElement('div');
                frame.style.width = Math.floor(viewport.width * state.displayScale) + 'px';
                frame.style.height = Math.floor(viewport.height * state.displayScale) + 'px';
                frame.style.position = 'relative';
                var canvas = document.createElement('canvas');
                var ctx = canvas.getContext('2d');
                canvas.width = Math.floor(viewport.width);
                canvas.height = Math.floor(viewport.height);
                pageWrap.appendChild(canvas);
                frame.appendChild(pageWrap);
                container.appendChild(frame);
                var pageRef = {
                    page: page,
                    viewport: viewport,
                    canvas: canvas,
                    pageWrap: pageWrap,
                    frame: frame,
                    matches: [],
                    renderPromise: null,
                    renderTask: null,
                    needsRerender: false
                };
                state.pages.push(pageRef);
                await renderPageWithPlaceholders(pageRef);
            }
            try { window.parent.postMessage({ type: 'cv-ready' }, window.location.origin); } catch (e) { }
        }

        async function updateOverlays() {
            if (state.updatingOverlays) {
                state.pendingOverlayUpdate = true;
                return;
            }
            state.updatingOverlays = true;
            for (var i = 0; i < state.pages.length; i++) {
                var p = state.pages[i];
                await renderPageWithPlaceholders(p);
            }
            state.updatingOverlays = false;
            if (state.pendingOverlayUpdate) {
                state.pendingOverlayUpdate = false;
                await updateOverlays();
            }
        }

        async function exportPng() {
            try {
                var first = state.pages[0];
                if (!first) throw new Error('Нет страниц для экспорта');
                var shot = await html2canvas(first.frame || first.pageWrap, { scale: 1.5, backgroundColor: '#ffffff' });
                var dataUrl = shot.toDataURL('image/jpeg', 0.9);
                window.parent.postMessage({ type: 'export-png-result', dataUrl: dataUrl }, window.location.origin);
            } catch (e) {
                window.parent.postMessage({ type: 'export-png-result', dataUrl: null, error: (e && e.message) }, window.location.origin);
            }
        }

        async function exportPdf() {
            try {
                var jsPDF = (window.jspdf && window.jspdf.jsPDF) ? window.jspdf.jsPDF : (window.jspdf || {}).jsPDF;
                if (!jsPDF) throw new Error('jsPDF не загружен');
                var pdf = new jsPDF({ unit: 'pt', format: 'a4' });
                for (var i = 0; i < state.pages.length; i++) {
                    var p = state.pages[i];
                    var shot = await html2canvas(p.frame || p.pageWrap, { scale: 2, backgroundColor: '#ffffff' });
                    var imgData = shot.toDataURL('image/png');
                    var pageWidth = pdf.internal.pageSize.getWidth();
                    var pageHeight = pdf.internal.pageSize.getHeight();
                    pdf.addImage(imgData, 'PNG', 0, 0, pageWidth, pageHeight, undefined, 'FAST');
                    if (i < state.pages.length - 1) pdf.addPage();
                }
                var blob = pdf.output('blob');
                var url = URL.createObjectURL(blob);
                window.parent.postMessage({ type: 'export-pdf-result', url: url }, window.location.origin);
            } catch (e) {
                window.parent.postMessage({ type: 'export-pdf-result', url: null, error: (e && e.message) }, window.location.origin);
            }
        }

        async function exportStrictHtml() {
            state.suspendRender = true;
            try {
                console.log('[exportStrictHtml] Starting export, pages:', state.pages.length);
                var pageHtmlParts = [];
                for (var i = 0; i < state.pages.length; i++) {
                    var p = state.pages[i];
                    var viewport = p.viewport;
                    var displayFactor = state.displayScale || 1;
                    var pageWidth = Math.floor(viewport.width * displayFactor);
                    var pageHeight = Math.floor(viewport.height * displayFactor);
                    console.log('[exportStrictHtml] Page', i, 'viewport:', viewport.width, 'x', viewport.height);

                    var bgUrl = '';
                    // Используем отдельный offscreen canvas для экспорта, чтобы не конфликтовать с live preview
                    console.log('[exportStrictHtml] Page', i, 'rendering to offscreen canvas');

                    // Отменяем активный рендер основного canvas, если он выполняется, чтобы освободить страницу для offscreen-рендера
                    if (p.renderTask) {
                        console.log('[exportStrictHtml] Page', i, 'cancelling active main canvas renderTask');
                        try {
                            p.renderTask.cancel();
                            await p.renderTask.promise.catch(() => { });
                        } catch (_) { }
                        p.renderTask = null;
                    }
                    if (p.renderPromise) {
                        console.log('[exportStrictHtml] Page', i, 'waiting for renderPromise to clear (max 3s)');
                        try {
                            await Promise.race([
                                p.renderPromise,
                                new Promise((_, reject) => setTimeout(() => reject(new Error('clearRender timeout')), 3000))
                            ]);
                            console.log('[exportStrictHtml] Page', i, 'renderPromise cleared successfully');
                        } catch (waitErr) {
                            console.warn('[exportStrictHtml] Page', i, 'renderPromise wait timeout, proceeding anyway');
                        }
                        // Не обнуляем renderPromise извне - let it clear naturally via finally block
                    }
                    // Небольшая пауза, чтобы PDF.js гарантированно освободил internal страницу
                    await new Promise(resolve => setTimeout(resolve, 100));

                    try {
                        var tmp = document.createElement('canvas');
                        tmp.width = Math.max(1, Math.floor(viewport.width));
                        tmp.height = Math.max(1, Math.floor(viewport.height));
                        var tctx = tmp.getContext('2d');
                        console.log('[exportStrictHtml] Page', i, 'offscreen canvas:', tmp.width, 'x', tmp.height);

                        // Рендерим страницу в offscreen canvas
                        console.log('[exportStrictHtml] Page', i, 'starting page.render()');
                        await p.page.render({ canvasContext: tctx, viewport: viewport }).promise;
                        console.log('[exportStrictHtml] Page', i, 'page.render() complete');

                        // Применяем placeholder values поверх
                        var matches = Array.isArray(p.matches) ? p.matches : [];
                        if (!matches.length) {
                            console.log('[exportStrictHtml] Page', i, 'extracting text content for matches');
                            try {
                                var tc = await p.page.getTextContent();
                                matches = extractPlaceholderMatches(tc);
                            } catch (err) {
                                console.warn('[exportStrictHtml] Page', i, 'text extraction failed:', err?.message || String(err), err);
                                matches = [];
                            }
                        }
                        console.log('[exportStrictHtml] Page', i, 'drawing', matches.length, 'placeholder values');
                        drawPlaceholderValues(tctx, viewport, matches);

                        bgUrl = tmp.toDataURL('image/png');
                        console.log('[exportStrictHtml] Page', i, 'bgUrl length:', bgUrl?.length || 0);
                    } catch (renderErr) {
                        console.error('[exportStrictHtml] Page', i, 'offscreen render failed:', renderErr?.message || renderErr?.name || String(renderErr), renderErr);
                        bgUrl = '';
                    }

                    var lines = ["<div class=\"page-wrap\" style=\"position:relative;width:" + pageWidth + "px;height:" + pageHeight + "px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)\">"];
                    if (bgUrl) {
                        console.log('[exportStrictHtml] Page', i, 'adding bg img to HTML');
                        lines.push("<img src=\"" + bgUrl + "\" style=\"position:absolute;left:0;top:0;width:" + pageWidth + "px;height:" + pageHeight + "px;display:block\" />");
                    } else {
                        console.warn('[exportStrictHtml] Page', i, 'NO BACKGROUND IMAGE, white fallback');
                    }
                    // Placeholder values уже встроены в PNG через drawPlaceholderValues, не добавляем spans
                    lines.push('</div>');
                    pageHtmlParts.push(lines.join(''));
                }
                var html = "<!DOCTYPE html><html lang=\"ru\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>PDF → HTML</title><style>html,body{margin:0;padding:0;background:#f8fafc;font-family:Inter,system-ui,Arial,sans-serif}#pages{display:flex;flex-direction:column;align-items:center;gap:12px;padding:0;width:100%;max-width:100%}</style></head><body><div id=\"pages\">" + pageHtmlParts.join('') + "</div></body></html>";
                console.log('[exportStrictHtml] Export complete, html length:', html.length);
                // Проверка на пустой HTML
                if (!html || html.length < 200 || pageHtmlParts.length === 0) {
                    console.error('[exportStrictHtml] Generated HTML is too short or empty');
                    window.parent.postMessage({ type: 'export-strict-html-result', html: null, error: 'Generated HTML is empty or invalid' }, window.location.origin);
                    // Восстанавливаем live preview после экспорта
                    updateOverlays();
                    return;
                }
                window.parent.postMessage({ type: 'export-strict-html-result', html: html }, window.location.origin);
            } catch (e) {
                console.error('[exportStrictHtml] ERROR:', e?.message || e?.name || String(e), e);
                window.parent.postMessage({ type: 'export-strict-html-result', html: null, error: (e && e.message) }, window.location.origin);
            } finally {
                // Восстанавливаем live preview после экспорта/ошибки
                state.suspendRender = false;
                console.log('[exportStrictHtml] Restoring live preview');
                updateOverlays();
            }
        }

        // Vector HTML export: background as SVG/clean canvas, text as selectable spans
        async function exportStrictHtmlVector() {
            state.suspendRender = true;
            try {
                var parts = [];
                for (var i = 0; i < state.pages.length; i++) {
                    var p = state.pages[i];
                    var page = p.page;
                    var viewport = p.viewport;
                    var displayFactor = state.displayScale || 1;
                    var pageWidth = Math.floor(viewport.width * displayFactor);
                    var pageHeight = Math.floor(viewport.height * displayFactor);

                    // --- Background (colors/shapes), без текста ---
                    var bgHtml = '';
                    var usedSvgBg = false;
                    if (window.pdfjsLib && window.pdfjsLib.SVGGraphics && page && page.getOperatorList && window.pdfjsLib.OPS) {
                        try {
                            var fullOps = await page.getOperatorList({ fontExtraProperties: true });
                            var OPS = window.pdfjsLib.OPS;
                            var toExclude = [];
                            if (typeof OPS.showText !== 'undefined') toExclude.push(OPS.showText);
                            if (typeof OPS.showTextRuns !== 'undefined') toExclude.push(OPS.showTextRuns);
                            if (typeof OPS.fillText !== 'undefined') toExclude.push(OPS.fillText);
                            if (typeof OPS.strokeText !== 'undefined') toExclude.push(OPS.strokeText);
                            if (typeof OPS.paintChar !== 'undefined') toExclude.push(OPS.paintChar);
                            if (typeof OPS.paintChars !== 'undefined') toExclude.push(OPS.paintChars);
                            if (typeof OPS.paintType3Glyph !== 'undefined') toExclude.push(OPS.paintType3Glyph);
                            if (typeof OPS.paintType3Chars !== 'undefined') toExclude.push(OPS.paintType3Chars);
                            var textOps = new Set(toExclude);
                            var filteredFn = [];
                            var filteredArgs = [];
                            for (var oi = 0; oi < fullOps.fnArray.length; oi++) {
                                var fn = fullOps.fnArray[oi];
                                if (!textOps.has(fn)) {
                                    filteredFn.push(fn);
                                    filteredArgs.push(fullOps.argsArray[oi]);
                                }
                            }
                            var filteredOpList = { fnArray: filteredFn, argsArray: filteredArgs };
                            var svgGfx = new window.pdfjsLib.SVGGraphics(page.commonObjs, page.objs);
                            // Allow generation even if fonts are not embedded
                            svgGfx.embedFonts = false;
                            var svgEl = await svgGfx.getSVG(filteredOpList, viewport);
                            svgEl.setAttribute('width', String(pageWidth));
                            svgEl.setAttribute('height', String(pageHeight));
                            svgEl.setAttribute('viewBox', '0 0 ' + viewport.width + ' ' + viewport.height);
                            bgHtml = replacePlaceholdersInSvg(new XMLSerializer().serializeToString(svgEl));
                            usedSvgBg = true;
                        } catch (svgErr) {
                            console.warn('[exportStrictHtmlVector] SVG background failed, fallback to canvas:', svgErr?.message || svgErr);
                            usedSvgBg = false;
                        }
                    }

                    if (!usedSvgBg) {
                        try {
                            var bgCanvas = document.createElement('canvas');
                            bgCanvas.width = Math.max(1, Math.floor(viewport.width));
                            bgCanvas.height = Math.max(1, Math.floor(viewport.height));
                            var bgCtx = bgCanvas.getContext('2d');
                            await page.render({ canvasContext: bgCtx, viewport: viewport, intent: 'print' }).promise;

                            // --- SOLUTION 3: менее агрессивная маска — не full-width, чтобы сохранить цветную шапку ---
                            var textContentForMask = await page.getTextContent();
                            var itemsForMask = textContentForMask.items || [];
                            bgCtx.globalCompositeOperation = 'destination-out';
                            var padX = state.maskPadX !== undefined ? state.maskPadX : 4;
                            var padY = state.maskPadY !== undefined ? state.maskPadY : 4;
                            var hFactor = state.maskHeightFactor !== undefined ? state.maskHeightFactor : 1.2;
                            var rowBuckets = [];
                            var baselineTol = Math.max(4, (state.maskBaselineTol || 0.25) * 10);
                            for (var mk = 0; mk < itemsForMask.length; mk++) {
                                var mit = itemsForMask[mk];
                                var raw = String(mit.str || mit.text || '');
                                if (!raw.trim()) continue;
                                var tfm = mit.transform || [1, 0, 0, 1, 0, 0];
                                var ma = tfm[0], mb = tfm[1], md = tfm[3], me = tfm[4], mf = tfm[5];
                                var mFontSize = Math.max(8, Math.abs(md) || Math.hypot(ma, mb) || 12);
                                var mWidth = mit.width || (raw.length * mFontSize * 0.62);
                                var mLeft = me - padX;
                                var mTop = (viewport.height - mf) - (mFontSize * 1.0) - padY;
                                var mHeight = mFontSize * hFactor + padY * 2;
                                var mWidthLine = mWidth + padX * 2;
                                bgCtx.fillStyle = 'rgba(0,0,0,1)';
                                bgCtx.fillRect(mLeft, mTop, Math.max(1, mWidthLine), Math.max(1, mHeight));

                                var bucket = null;
                                for (var bi = 0; bi < rowBuckets.length; bi++) {
                                    if (Math.abs(rowBuckets[bi].baseline - mf) <= baselineTol) { bucket = rowBuckets[bi]; break; }
                                }
                                if (!bucket) {
                                    bucket = { baseline: mf, minX: me, maxX: me + mWidth, maxFont: mFontSize };
                                    rowBuckets.push(bucket);
                                } else {
                                    bucket.minX = Math.min(bucket.minX, me);
                                    bucket.maxX = Math.max(bucket.maxX, me + mWidth);
                                    bucket.maxFont = Math.max(bucket.maxFont, mFontSize);
                                }
                            }
                            // SOLUTION 3: маска по ширине текста (minX..maxX), не full-width — не затирает цветную полосу шапки
                            for (var rb = 0; rb < rowBuckets.length; rb++) {
                                var r = rowBuckets[rb];
                                var mLeft2 = Math.max(0, r.minX - padX);
                                var mTop2 = (viewport.height - r.baseline) - (r.maxFont * 1.0) - padY;
                                var mHeight2 = r.maxFont * hFactor + padY * 2;
                                var mWidth2 = Math.min(viewport.width - mLeft2, (r.maxX - r.minX) + padX * 2);
                                bgCtx.fillRect(mLeft2, mTop2, Math.max(1, mWidth2), Math.max(1, mHeight2));
                            }
                            bgCtx.globalCompositeOperation = 'source-over';
                            var bgUrl = bgCanvas.toDataURL('image/png');
                            bgHtml = '<img src="' + bgUrl + '" style="position:absolute;left:0;top:0;width:' + pageWidth + 'px;height:' + pageHeight + 'px;display:block" />';
                        } catch (bgErr) {
                            console.warn('[exportStrictHtmlVector] Canvas background failed:', bgErr?.message || bgErr);
                            bgHtml = '';
                        }
                    }

                    // --- Текстовый слой: всегда текстовые spans ---
                    var textSpans = [];
                    var placeholderCounters = { text: 0 };
                    try {
                        var textContent = await page.getTextContent();
                        var items = textContent.items || [];
                        var rows = [];
                        var tol = Math.max(2, state.maskBaselineTol * 10);
                        for (var t = 0; t < items.length; t++) {
                            var it = items[t];
                            var raw = String(it.str || it.text || '');
                            if (!raw.trim()) continue;
                            var tfm = it.transform || [1, 0, 0, 1, 0, 0];
                            var a = tfm[0], b = tfm[1], d = tfm[3], e = tfm[4], f = tfm[5];
                            var fontSize = Math.max(8, Math.hypot(a, b) || Math.abs(d) || 12);
                            var baseline = f;
                            var row = null;
                            for (var ri = 0; ri < rows.length; ri++) {
                                if (Math.abs(rows[ri].baseline - baseline) <= tol) { row = rows[ri]; break; }
                            }
                            if (!row) {
                                row = { baseline: baseline, items: [], maxFont: fontSize };
                                rows.push(row);
                            }
                            row.maxFont = Math.max(row.maxFont, fontSize);
                            row.items.push({ x: e, width: it.width || (raw.length * fontSize * 0.62), fontSize: fontSize, text: raw, fontName: it.fontName || '', fontWeight: it.fontWeight || 400 });
                        }
                        // Sort rows top-to-bottom (PDF baseline desc)
                        rows.sort(function (a, b) { return b.baseline - a.baseline; });
                        for (var r = 0; r < rows.length; r++) {
                            var row = rows[r];
                            row.items.sort(function (a, b) { return a.x - b.x; });
                            var lineText = '';
                            var minX = row.items[0].x;
                            var maxX = row.items[0].x + row.items[0].width;
                            for (var ii = 0; ii < row.items.length; ii++) {
                                var itm = row.items[ii];
                                if (ii > 0) {
                                    var prev = row.items[ii - 1];
                                    var gap = itm.x - (prev.x + prev.width);
                                    if (gap > Math.max(prev.fontSize, itm.fontSize) * 0.25) lineText += ' ';
                                }
                                lineText += itm.text;
                                maxX = Math.max(maxX, itm.x + itm.width);
                            }
                            var key = detectPlaceholderKey(lineText, placeholderCounters);
                            if (!key) continue;
                            var mappedVal = mapValue(key, state.cvData) || '';
                            var displayVal = mappedVal; // hide placeholder when no user value
                            var fontSizeRow = row.maxFont;
                            var left = minX * displayFactor;
                            var top = ((viewport.height - row.baseline) - (fontSizeRow * 0.9)) * displayFactor;
                            var width = Math.max((maxX - minX), (displayVal ? displayVal.length * fontSizeRow * 0.62 : fontSizeRow * 0.5)) * displayFactor;
                            var lineHeight = Math.round(fontSizeRow * 1.12 * displayFactor);
                            textSpans.push(
                                '<span style="position:absolute;left:' + Math.round(left) + 'px;top:' + Math.round(Math.max(0, top)) + 'px;' +
                                'display:inline-block;min-width:' + Math.round(width) + 'px;' +
                                'font-size:' + Math.round(fontSizeRow * displayFactor) + 'px;line-height:' + Math.max(lineHeight, 1) + 'px;' +
                                'font-family:Inter,system-ui,Arial,sans-serif;font-weight:400;color:#111827;white-space:pre;user-select:text;" data-placeholder="' + key + '">' + escapeXml(displayVal) + '</span>'
                            );
                        }
                    } catch (txtErr) {
                        console.warn('[exportStrictHtmlVector] textContent fallback failed:', txtErr?.message || txtErr);
                    }

                    var bgLayer = bgHtml ? '<div class="svg-layer" style="position:absolute;left:0;top:0;width:' + pageWidth + 'px;height:' + pageHeight + 'px;pointer-events:none">' + bgHtml + '</div>' : '';
                    var textLayerHtml = textSpans.length ? '<div class="text-layer" style="position:absolute;left:0;top:0;width:' + pageWidth + 'px;height:' + pageHeight + 'px;pointer-events:auto;user-select:text;">' + textSpans.join('') + '</div>' : '';

                    parts.push(
                        '<div class="page-wrap" style="position:relative;width:' + pageWidth + 'px;height:' + pageHeight + 'px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)">' +
                        bgLayer + textLayerHtml +
                        '</div>'
                    );
                }

                var html =
                    '<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">' +
                    '<meta name="viewport" content="width=device-width,initial-scale=1">' +
                    '<title>PDF → HTML (vector)</title>' +
                    '<style>html,body{margin:0;padding:0;background:#f8fafc;font-family:Inter,system-ui,Arial,sans-serif}' +
                    '#pages{display:flex;flex-direction:column;align-items:center;gap:12px;padding:0;width:100%;max-width:100%}' +
                    '.text-layer{color:#111827} .text-layer span{caret-color:#111827} .svg-layer img{display:block;width:100%;height:100%;} .svg-layer svg{display:block;width:100%;height:100%;}</style></head><body>' +
                    '<div id="pages">' + parts.join('') + '</div></body></html>';

                window.parent.postMessage({ type: 'export-strict-html-vector-result', html: html }, window.location.origin);
            } catch (e) {
                window.parent.postMessage({ type: 'export-strict-html-vector-result', html: null, error: (e && e.message) }, window.location.origin);
            } finally {
                state.suspendRender = false;
                updateOverlays();
            }
        }

        window.addEventListener('message', function (e) {
            var msg = e && e.data; if (!msg) return;
            if (msg.type === 'cv-data') { state.cvData = msg.payload || msg.data || null; updateOverlays(); }
            if (msg.type === 'export-png') exportPng();
            if (msg.type === 'export-pdf') exportPdf();
            if (msg.type === 'export-strict-html') exportStrictHtml();
            if (msg.type === 'export-strict-html-vector') exportStrictHtmlVector();
        });

        (async function init() {
            state.src = getParam('src');
            // Чтение параметров маски из URL
            var pMaskPadX = parseFloat(getParam('maskPadX'));
            var pMaskPadY = parseFloat(getParam('maskPadY'));
            var pMaskHeightFactor = parseFloat(getParam('maskHeightFactor'));
            var pMaskBaselineTol = parseFloat(getParam('maskBaselineTol'));
            var pMaskDebug = getParam('maskDebug');
            if (!isNaN(pMaskPadX)) state.maskPadX = pMaskPadX;
            if (!isNaN(pMaskPadY)) state.maskPadY = pMaskPadY;
            if (!isNaN(pMaskHeightFactor)) state.maskHeightFactor = pMaskHeightFactor;
            if (!isNaN(pMaskBaselineTol)) state.maskBaselineTol = pMaskBaselineTol;
            state.maskDebug = (pMaskDebug === '1');
            if (!state.src) {
                var cont = document.getElementById('pages');
                var note = document.createElement('div');
                note.className = 'text-gray-700 text-sm';
                note.textContent = 'Не указан источник PDF. Добавьте ?src=/uploads/your.pdf';
                cont.appendChild(note);
                try { window.parent.postMessage({ type: 'cv-ready' }, window.location.origin); } catch (e) { }
                return;
            }
            try { await renderPdf(); }
            catch (e) {
                console.error('PDF render error:', e);
                var cont = document.getElementById('pages');
                var msg = document.createElement('div');
                msg.style.color = '#b91c1c';
                msg.style.background = '#fee2e2';
                msg.style.border = '1px solid #fecaca';
                msg.style.padding = '10px 12px';
                msg.style.borderRadius = '8px';
                msg.style.fontSize = '13px';
                msg.textContent = 'Не удалось загрузить PDF: ' + (state.src || '—') + '. Проверьте путь или доступ.';
                cont.appendChild(msg);
                try { window.parent.postMessage({ type: 'pdf-error', error: (e && e.message) || String(e) }, window.location.origin); } catch (_) { }
            }



        })();
    </script>
</body>

</html>
