<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Preview Overlay</title>
    <link rel="stylesheet" href="/css/tailwind.css">
    <style>
        html,
        body {
            background: #f8fafc;
            height: 100%;
        }

        #pages {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 16px;
        }

        .page-wrap {
            position: relative;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }

        .overlay-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .field {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            color: #111827;
            font-family: Inter, system-ui, Arial, sans-serif;
            white-space: nowrap;
            pointer-events: auto;
        }

        .hint {
            position: fixed;
            right: 12px;
            top: 12px;
            background: #0f172a;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            opacity: .85;
        }
    </style>
    <script>
        (function () {
            if (!document.getElementById('tw-cdn-fallback')) {
                const s = document.createElement('script');
                s.id = 'tw-cdn-fallback';
                s.src = 'https://cdn.tailwindcss.com';
                document.head.appendChild(s);
            }
        })();
    </script>
    <!-- PDF.js (UMD), html2canvas, jsPDF via jsDelivr -->
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <script>
        if (window['pdfjsLib']) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>

<body>
    <div class="hint">PDF предпросмотр с оверлеями</div>
    <div id="pages"></div>

    <script>
        const state = {
            src: null,
            pages: [],
            overlays: [],
            scale: 1.3,
            cvData: null,
        };

        function getParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        function toFileName(title) {
            const base = (title || 'resume').toString().trim().replace(/[^\w\-]+/g, '_');
            return base || 'resume';
        }

        function mapValue(key, data) {
            if (!data) return '';
            const p = data.personalInfo || {};
            const up = (s) => (s || '').toString();
            switch (key) {
                case 'FIRSTNAME': return up(p['given-name'] || p.givenName || p.firstName);
                case 'LASTNAME': return up(p['family-name'] || p.familyName || p.lastName);
                case 'JOBTITLE': return up(p['job-position'] || p.jobPosition);
                case 'EMAIL': return up(p.email);
                case 'PHONE': return up(p.phone);
                case 'ADDRESS': return up(p.address);
                case 'CITY': return up(p.city);
                case 'WEBSITE': return up(p.website);
                case 'LINKEDIN': return up(p.linkedin);
                case 'BIRTHDATE': return up(p.birthdate);
                case 'SUMMARY': return up(p.summary || (data.additionalSections && data.additionalSections.profile));
                case 'SKILLS': {
                    const arr = Array.isArray(data.skills) ? data.skills : [];
                    return arr.map(s => s.skill || s.name).filter(Boolean).join(', ');
                }
                default:
                    return '';
            }
        }

        function createOverlay(pageWrap, viewport, matches) {
            const overlay = document.createElement('div');
            overlay.className = 'overlay-layer';
            pageWrap.appendChild(overlay);

            matches.forEach(item => {
                const { key, x, y, width, fontSize } = item;
                const value = mapValue(key, state.cvData);
                const el = document.createElement('div');
                el.className = 'field';
                const left = x * state.scale;
                const top = (viewport.height - y) * state.scale - (fontSize * state.scale * 0.8);
                el.style.left = `${left}px`;
                el.style.top = `${Math.max(0, top)}px`;
                el.style.fontSize = `${Math.max(10, fontSize * state.scale)}px`;
                el.style.padding = '2px 4px';
                el.textContent = value || '';
                overlay.appendChild(el);
            });

            state.overlays.push(overlay);
        }

        async function renderPdf() {
            const src = state.src;
            if (!src || !window.pdfjsLib) return;
            const container = document.getElementById('pages');
            container.innerHTML = '';
            state.pages = [];
            state.overlays = [];

            const loadingTask = window.pdfjsLib.getDocument(src);
            const pdf = await loadingTask.promise;
            const total = pdf.numPages;

            for (let n = 1; n <= total; n++) {
                const page = await pdf.getPage(n);
                const viewport = page.getViewport({ scale: state.scale });
                const pageWrap = document.createElement('div');
                pageWrap.className = 'page-wrap';
                pageWrap.style.width = `${viewport.width}px`;
                pageWrap.style.height = `${viewport.height}px`;

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = Math.floor(viewport.width);
                canvas.height = Math.floor(viewport.height);
                pageWrap.appendChild(canvas);

                container.appendChild(pageWrap);
                state.pages.push({ page, viewport, canvas, pageWrap });

                await page.render({ canvasContext: ctx, viewport }).promise;

                // Try to detect placeholders like {{FIRSTNAME}}
                const textContent = await page.getTextContent();
                const items = textContent.items || [];
                const matches = [];
                const re = /\{\{\s*([A-Z_]+)\s*\}\}/g;
                for (const it of items) {
                    const str = String(it.str || it.text || '');
                    let m;
                    while ((m = re.exec(str)) !== null) {
                        const key = m[1];
                        const tf = it.transform || [1, 0, 0, 1, 0, 0];
                        const a = tf[0], b = tf[1], c = tf[2], d = tf[3], e = tf[4], f = tf[5];
                        const fontSize = Math.hypot(a, b) || 12;
                        const width = (it.width || (str.length * fontSize * 0.6));
                        matches.push({ key, x: e, y: f, width, fontSize });
                    }
                }
                if (matches.length) {
                    createOverlay(pageWrap, viewport, matches);
                }
            }

            try { window.parent.postMessage({ type: 'cv-ready' }, window.location.origin); } catch (_) { }
        }

        function updateOverlays() {
            // Re-render overlays with current cvData
            state.overlays.forEach(ov => ov.remove());
            state.overlays = [];
            state.pages.forEach(({ page, viewport, pageWrap }) => {
                // For simplicity, re-extract placeholders per page
                page.getTextContent().then(textContent => {
                    const items = textContent.items || [];
                    const matches = [];
                    const re = /\{\{\s*([A-Z_]+)\s*\}\}/g;
                    for (const it of items) {
                        const str = String(it.str || it.text || '');
                        let m;
                        while ((m = re.exec(str)) !== null) {
                            const key = m[1];
                            const tf = it.transform || [1, 0, 0, 1, 0, 0];
                            const a = tf[0], b = tf[1], c = tf[2], d = tf[3], e = tf[4], f = tf[5];
                            const fontSize = Math.hypot(a, b) || 12;
                            const width = (it.width || (str.length * fontSize * 0.6));
                            matches.push({ key, x: e, y: f, width, fontSize });
                        }
                    }
                    if (matches.length) {
                        createOverlay(pageWrap, viewport, matches);
                    }
                }).catch(() => { });
            });
        }

        async function exportPng() {
            try {
                // Export first page including overlays via html2canvas
                const first = state.pages[0];
                if (!first) throw new Error('Нет страниц для экспорта');
                // Снижаем размер: меньше scale и JPEG вместо PNG
                const shot = await html2canvas(first.pageWrap, { scale: 1.5, backgroundColor: '#ffffff' });
                const dataUrl = shot.toDataURL('image/jpeg', 0.9);
                window.parent.postMessage({ type: 'export-png-result', dataUrl }, window.location.origin);
            } catch (e) {
                window.parent.postMessage({ type: 'export-png-result', dataUrl: null, error: e?.message }, window.location.origin);
            }
        }

        async function exportPdf() {
            try {
                const { jsPDF } = window.jspdf || {};
                if (!jsPDF) throw new Error('jsPDF не загружен');
                const pdf = new jsPDF({ unit: 'pt', format: 'a4' });
                for (let i = 0; i < state.pages.length; i++) {
                    const p = state.pages[i];
                    const shot = await html2canvas(p.pageWrap, { scale: 2, backgroundColor: '#ffffff' });
                    const imgData = shot.toDataURL('image/png');
                    const pageWidth = pdf.internal.pageSize.getWidth();
                    const pageHeight = pdf.internal.pageSize.getHeight();
                    // Fit image into page
                    pdf.addImage(imgData, 'PNG', 0, 0, pageWidth, pageHeight, undefined, 'FAST');
                    if (i < state.pages.length - 1) pdf.addPage();
                }
                const blob = pdf.output('blob');
                const url = URL.createObjectURL(blob);
                window.parent.postMessage({ type: 'export-pdf-result', url }, window.location.origin);
            } catch (e) {
                window.parent.postMessage({ type: 'export-pdf-result', url: null, error: e?.message }, window.location.origin);
            }
        }

        async function exportStrictHtml() {
            try {
                // Строим текстовую HTML-верстку с абсолютным позиционированием из PDF textContent
                const pageHtmlParts = [];
                for (let i = 0; i < state.pages.length; i++) {
                    const { page, viewport } = state.pages[i];
                    const textContent = await page.getTextContent();
                    const items = textContent.items || [];
                    const lines = [`<div class="page-wrap" style="position:relative;width:${Math.floor(viewport.width)}px;height:${Math.floor(viewport.height)}px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)">`];
                    for (const it of items) {
                        const str = String(it.str || it.text || '').replace(/[\u0000-\u001F]/g, '');
                        if (!str.trim()) continue;
                        const tf = it.transform || [1, 0, 0, 1, 0, 0];
                        const a = tf[0], b = tf[1], c = tf[2], d = tf[3], e = tf[4], f = tf[5];
                        const fontSize = Math.max(8, Math.hypot(a, b) || 12);
                        const left = e;
                        const top = (viewport.height - f) - fontSize * 0.8;
                        const safe = str
                            .replace(/&/g, '&amp;')
                            .replace(/</g, '&lt;')
                            .replace(/>/g, '&gt;');
                        lines.push(`<span style="position:absolute;left:${Math.round(left)}px;top:${Math.round(Math.max(0, top))}px;font-size:${Math.round(fontSize)}px;white-space:pre;">${safe}</span>`);
                    }
                    lines.push('</div>');
                    pageHtmlParts.push(lines.join(''));
                }
                const html = `<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF → HTML</title><style>html,body{margin:0;padding:0;background:#f8fafc;font-family:Inter,system-ui,Arial,sans-serif}#pages{display:flex;flex-direction:column;align-items:center;gap:20px;padding:16px}</style></head><body><div id="pages">${pageHtmlParts.join('')}</div></body></html>`;
                window.parent.postMessage({ type: 'export-strict-html-result', html }, window.location.origin);
            } catch (e) {
                window.parent.postMessage({ type: 'export-strict-html-result', html: null, error: e?.message }, window.location.origin);
            }
        }

        window.addEventListener('message', (e) => {
            const msg = e?.data;
            if (!msg) return;
            if (msg.type === 'cv-data') {
                state.cvData = msg.payload || msg.data || null;
                updateOverlays();
            }
            if (msg.type === 'export-png') exportPng();
            if (msg.type === 'export-pdf') exportPdf();
            if (msg.type === 'export-strict-html') exportStrictHtml();
        });

        (async function init() {
            state.src = getParam('src');
            if (!state.src) {
                const cont = document.getElementById('pages');
                const note = document.createElement('div');
                note.className = 'text-gray-700 text-sm';
                note.textContent = 'Не указан источник PDF. Добавьте ?src=/uploads/your.pdf';
                cont.appendChild(note);
                try { window.parent.postMessage({ type: 'cv-ready' }, window.location.origin); } catch (_) { }
                return;
            }
            try {
                await renderPdf();
            } catch (e) {
                console.error('PDF render error:', e);
            }
        })();
    </script>
</body>

</html>
