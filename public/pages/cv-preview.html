<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Предварительный просмотр резюме</title>
  <link rel="stylesheet" href="/css/tailwind.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
    }

    .cv-card {
      background: var(--bg);
      border-radius: 1.5rem;
      padding: 2rem;
    }

    .cv-card::selection {
      background: rgba(37, 99, 235, .15);
    }

    .cv-body {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .cv-column {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .cv-left section,
    .cv-right section {
      padding: 0;
      border: none;
    }

    .cv-title {
      font-size: 2rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
    }

    .cv-title-line {
      display: block;
      line-height: 1.1;
    }

    .cv-header {
      background: var(--bg);
    }

    .section-head {
      text-transform: none;
      letter-spacing: normal;
    }

    .summary-text {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #475569;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      font-size: 0.85rem;
      margin-right: 0.4rem;
      margin-bottom: 0.4rem;
      background: var(--chip-bg);
      border: 1px solid var(--chip-bd);
    }

    .cv-left,
    .cv-right {
      width: 100%;
    }

    .tpl-modern {
      --accent: #2563eb;
      --bg: #ffffff;
      --muted: #6b7280;
      --chip-bg: rgba(37, 99, 235, .08);
      --chip-bd: #bfdbfe;
    }

    .tpl-classic {
      --accent: #111827;
      --bg: #ffffff;
      --muted: #4b5563;
      --chip-bg: #f3f4f6;
      --chip-bd: #e5e7eb;
    }

    .tpl-minimal {
      --accent: #374151;
      --bg: #ffffff;
      --muted: #9ca3af;
      --chip-bg: #ffffff;
      --chip-bd: #e5e7eb;
    }

    /* Уточнения под PDF-примеры для классического/минимального */
    .tpl-classic .cv-header {
      padding-bottom: 0.25rem;
    }

    .tpl-classic .cv-title {
      font-size: 36px;
      letter-spacing: -0.015em;
    }

    .tpl-minimal .cv-header {
      padding-bottom: 0.25rem;
    }

    .tpl-minimal .cv-title {
      font-size: 34px;
      letter-spacing: 0;
    }

    .tpl-minimal .section-head,
    .tpl-classic .section-head {
      text-transform: none;
      letter-spacing: 0;
    }

    .tpl-creative {
      --accent: #7c3aed;
      --bg: #ffffff;
      --muted: #6b7280;
      --chip-bg: rgba(124, 58, 237, .08);
      --chip-bd: #c4b5fd;
    }

    .tpl-european {
      --accent: #2f47a3;
      --bg: #ffffff;
      --muted: #7c88b0;
      --chip-bg: rgba(47, 71, 163, .08);
      --chip-bd: #c7cefb;
    }

    .tpl-europass {
      --accent: #1f3c88;
      --bg: #ffffff;
      --muted: #647099;
      --chip-bg: rgba(31, 60, 136, .08);
      --chip-bd: #cfd6ff;
    }

    /* Быстрые цветовые схемы (поверх шаблона) */
    .theme-blue {
      --accent: #2563eb;
      --chip-bg: rgba(37, 99, 235, .08);
      --chip-bd: #bfdbfe;
    }

    .theme-emerald {
      --accent: #059669;
      --chip-bg: rgba(5, 150, 105, .08);
      --chip-bd: #a7f3d0;
    }

    .theme-rose {
      --accent: #e11d48;
      --chip-bg: rgba(225, 29, 72, .08);
      --chip-bd: #fecdd3;
    }

    /* Размер текста */
    .font-small {
      font-size: 14px;
    }

    .font-medium {
      font-size: 16px;
    }

    .font-large {
      font-size: 18px;
    }

    .tpl-european .cv-body {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 2.25rem;
    }

    .tpl-european .cv-left {
      background: #f4f6ff;
      border-radius: 1.5rem;
      padding: 1.75rem;
      box-shadow: inset 0 0 0 1px rgba(99, 102, 241, .08);
    }

    .tpl-european .cv-header {
      margin-bottom: 0.5rem;
      padding-bottom: 0;
    }

    .tpl-european .cv-title {
      font-size: 42px;
      letter-spacing: -0.03em;
    }

    .tpl-european .cv-title-line+.cv-title-line {
      margin-top: -0.35rem;
    }

    .tpl-european #cvPhotoWrap {
      width: 96px;
      height: 96px;
      border: 4px solid #fff;
      box-shadow: 0 12px 30px rgba(47, 71, 163, .25);
    }

    .tpl-european .section-head {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #94a3b8;
    }

    .tpl-european #personalFields .muted {
      color: #94a3b8;
    }

    .tpl-european #skillsList,
    .tpl-european #languagesList {
      display: block;
    }

    .tpl-europass .cv-body {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 2.5rem;
    }

    .tpl-europass .cv-left {
      background: linear-gradient(180deg, #f7f9ff 0%, #eef1ff 100%);
      border-radius: 1.75rem;
      padding: 1.8rem;
      box-shadow: inset 0 0 0 1px rgba(31, 60, 136, .12);
    }

    .tpl-europass .cv-right {
      position: relative;
      padding-left: 2rem;
    }

    .tpl-europass .cv-right::before {
      content: '';
      position: absolute;
      left: 0.6rem;
      top: 0.75rem;
      bottom: 0.75rem;
      width: 2px;
      background: rgba(31, 60, 136, .25);
    }

    .tpl-europass .cv-title {
      font-size: 40px;
      letter-spacing: -0.025em;
    }

    .tpl-europass .cv-title-line+.cv-title-line {
      margin-top: -0.25rem;
    }

    .tpl-europass #cvPhotoWrap {
      width: 110px;
      height: 110px;
      border: 5px solid #fff;
      box-shadow: 0 16px 35px rgba(15, 23, 42, .25);
    }

    .tpl-europass .section-head {
      font-size: 0.78rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #95a3c5;
    }

    .tpl-europass #employmentList>div,
    .tpl-europass #educationList>div {
      position: relative;
      padding-left: 1.5rem;
      border: none;
      margin-bottom: 1.75rem;
    }

    .tpl-europass #employmentList>div:last-child,
    .tpl-europass #educationList>div:last-child {
      margin-bottom: 0;
    }

    .tpl-europass #employmentList>div::before,
    .tpl-europass #educationList>div::before {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 999px;
      border: 2px solid #fff;
      background: var(--accent);
      left: -0.95rem;
      top: 0.25rem;
      box-shadow: 0 4px 12px rgba(15, 23, 42, .18);
    }

    @media (max-width: 1023px) {
      .tpl-european .cv-body {
        grid-template-columns: 1fr;
      }

      .tpl-european .cv-left {
        order: 1;
      }

      .tpl-european .cv-right {
        order: 2;
      }

      .tpl-europass .cv-body {
        grid-template-columns: 1fr;
      }

      .tpl-europass .cv-right {
        padding-left: 0;
      }

      .tpl-europass .cv-right::before {
        display: none;
      }
    }

    /* Subtle flash when headline appears/updates */
    .headline-flash {
      animation: headlineFade 900ms ease-out;
      display: inline-block;
      padding: 2px 6px;
      border-radius: 6px;
    }

    @keyframes headlineFade {
      0% {
        background: rgba(59, 130, 246, 0.20);
      }

      50% {
        background: rgba(59, 130, 246, 0.10);
      }

      100% {
        background: transparent;
      }
    }
  </style>
</head>

<body class="bg-gray-50">
  <script>
    // Tailwind CDN fallback: гарантируем стили превью при любых сбоях
    (function () {
      if (!document.getElementById('tw-cdn-fallback')) {
        const s = document.createElement('script');
        s.id = 'tw-cdn-fallback';
        s.src = 'https://cdn.tailwindcss.com';
        document.head.appendChild(s);
        console.warn('Tailwind CSS: CDN fallback загружен (preview)');
      }
    })();
  </script>
  <div class="max-w-4xl mx-auto p-6">
    <div id="docxNotice" class="hidden bg-yellow-50 border border-yellow-200 text-yellow-900 rounded-lg p-4 mb-4">
      <div class="font-semibold mb-1">Предпросмотр DOCX недоступен в браузере.</div>
      <div class="text-sm">Вы можете <a id="docxDownload" href="#" class="underline text-yellow-900">скачать шаблон</a>
        и открыть его в редакторе документов.</div>
    </div>
    <div class="flex flex-wrap items-center justify-between mb-4 gap-3">
      <div class="text-sm text-gray-500">Выберите шаблон:</div>
      <div class="flex flex-wrap gap-2" id="tplPicker">
        <button type="button" data-tpl="modern" class="px-3 py-1 text-sm rounded border">Современный</button>
        <button type="button" data-tpl="classic" class="px-3 py-1 text-sm rounded border">Классический</button>
        <button type="button" data-tpl="minimal" class="px-3 py-1 text-sm rounded border">Минималистичный</button>
        <button type="button" data-tpl="creative" class="px-3 py-1 text-sm rounded border">Креативный</button>
        <button type="button" data-tpl="european" class="px-3 py-1 text-sm rounded border">Европейский</button>
        <button type="button" data-tpl="europass" class="px-3 py-1 text-sm rounded border">Europass</button>
      </div>
    </div>

    <div id="cvRoot" class="cv-card shadow rounded-lg tpl-modern theme-blue font-medium">
      <div class="cv-header p-4 -mx-4 -mt-4 mb-3 rounded">
        <div class="flex flex-wrap items-center justify-between gap-4">
          <div>
            <div id="cvHeadline" class="text-xs uppercase tracking-[0.3em] text-gray-400"></div>
            <h1 id="cvTitle" class="cv-title mt-1">Моё резюме</h1>
          </div>
          <div class="flex items-center gap-3">
            <span id="cvTemplate" class="text-xs px-2 py-1 rounded border bg-white/70">modern</span>
            <span id="cvDocx" class="text-xs px-2 py-1 rounded border bg-white/70">DOCX: Custom</span>
            <div id="cvPhotoWrap" class="w-20 h-20 overflow-hidden border hidden">
              <img id="cvPhoto" alt="photo" class="w-full h-full object-cover" />
            </div>
          </div>
        </div>
      </div>

      <div class="cv-body">
        <div class="cv-left">
          <section id="summary" class="hidden">
            <h2 class="section-head text-sm font-semibold text-gray-500">Профиль</h2>
            <p id="summaryContent" class="summary-text mt-2"></p>
          </section>

          <section id="personalInfo" class="hidden">
            <h2 class="section-head text-lg font-semibold accent">Контакты</h2>
            <div id="personalFields" class="mt-2 grid grid-cols-1 gap-2"></div>
          </section>

          <section id="skills" class="hidden">
            <h2 class="section-head text-lg font-semibold accent">Навыки</h2>
            <div id="skillsList" class="mt-2"></div>
          </section>

          <section id="languages" class="hidden">
            <h2 class="section-head text-lg font-semibold accent">Языки</h2>
            <div id="languagesList" class="mt-2"></div>
          </section>
        </div>

        <div class="cv-right">
          <section id="employment" class="hidden">
            <h2 class="section-head text-lg font-semibold accent">Опыт работы</h2>
            <div id="employmentList" class="mt-2 space-y-4"></div>
          </section>

          <section id="education" class="hidden">
            <h2 class="section-head text-lg font-semibold accent">Образование</h2>
            <div id="educationList" class="mt-2 space-y-4"></div>
          </section>

          <section id="additional" class="hidden">
            <h2 class="section-head text-lg font-semibold accent">Дополнительно</h2>
            <div id="additionalContent" class="mt-2 space-y-3"></div>
          </section>
        </div>
      </div>

      <div class="mt-6 flex flex-wrap gap-3">
        <a href="/pages/cv-builder"
          class="inline-flex items-center px-4 py-2 rounded bg-blue-600 text-white">Редактировать</a>
        <button id="applyTplBtn" class="inline-flex items-center px-4 py-2 rounded border">Применить шаблон</button>
      </div>
    </div>
  </div>

  <script>
    // Если пришёл docx в query, показываем понятную заглушку
    (function () {
      try {
        const url = new URL(window.location.href);
        const docx = url.searchParams.get('docx');
        if (docx) {
          document.getElementById('tplPicker').classList.add('hidden');
          document.getElementById('applyTplBtn').classList.add('hidden');
          document.getElementById('cvRoot').classList.add('hidden');
          const n = document.getElementById('docxNotice');
          const a = document.getElementById('docxDownload');
          a.href = docx;
          n.classList.remove('hidden');
        }
      } catch (_) { }
    })();
    function getData() {
      try {
        const url = new URL(window.location.href);
        const raw = url.searchParams.get('data');
        if (raw) return JSON.parse(decodeURIComponent(raw));
        // fallback: если передан template в query, используем его до postMessage
        const tpl = url.searchParams.get('template');
        if (tpl) {
          const local = localStorage.getItem('cvBuilderData');
          const base = local ? JSON.parse(local) : {};
          base.template = tpl;
          return base;
        }
      } catch (_) { }
      try {
        const local = localStorage.getItem('cvBuilderData');
        if (local) return JSON.parse(local);
      } catch (_) { }
      return {};
    }

    function applyTemplate(root, template) {
      root.classList.remove('tpl-modern', 'tpl-classic', 'tpl-minimal', 'tpl-creative', 'tpl-european', 'tpl-europass');
      const map = { modern: 'tpl-modern', classic: 'tpl-classic', minimal: 'tpl-minimal', creative: 'tpl-creative', european: 'tpl-european', europass: 'tpl-europass' };
      root.classList.add(map[template] || 'tpl-modern');
      // Форма фото согласно шаблону (квадрат/прямоугольник для PDF-примеров)
      try {
        const wrap = document.getElementById('cvPhotoWrap');
        if (wrap) {
          if (template === 'classic' || template === 'minimal') {
            wrap.classList.remove('rounded-full');
            wrap.classList.add('rounded');
          } else {
            wrap.classList.remove('rounded');
            wrap.classList.add('rounded-full');
          }
        }
      } catch (_) { }
      document.querySelectorAll('#tplPicker [data-tpl]').forEach(btn => {
        if (btn.dataset.tpl === template) {
          btn.classList.add('border-blue-400', 'ring-2', 'ring-blue-200');
        } else {
          btn.classList.remove('border-blue-400', 'ring-2', 'ring-blue-200');
        }
      });
    }

    function applyQuickStyles(root, settings) {
      const color = (settings && settings.colorScheme) || 'blue';
      const size = (settings && settings.fontSize) || 'medium';
      root.classList.remove('theme-blue', 'theme-emerald', 'theme-rose', 'font-small', 'font-medium', 'font-large');
      root.classList.add(`theme-${color}`);
      root.classList.add(`font-${size}`);
    }

    function render(dataOverride) {
      if (!window.__cvPreviewListenerAttached) {
        window.addEventListener('message', (event) => {
          const payload = event.data;
          if (!payload || payload.type !== 'cv-data') return;
          render(payload.payload || {});
        });
        window.__cvPreviewListenerAttached = true;
      }
      const data = dataOverride || getData();
      const template = data.template || 'modern';
      const root = document.getElementById('cvRoot');
      const titleEl = document.getElementById('cvTitle');
      const tplEl = document.getElementById('cvTemplate');
      const docxEl = document.getElementById('cvDocx');
      const headlineEl = document.getElementById('cvHeadline');
      const photoWrap = document.getElementById('cvPhotoWrap');
      const photoImg = document.getElementById('cvPhoto');
      const summarySection = document.getElementById('summary');
      const summaryContent = document.getElementById('summaryContent');

      tplEl.textContent = template;
      // Show mapped DOCX variant for clarity
      if (docxEl) {
        const docxMap = { classic: 'Experienced', minimal: 'Entry-level' };
        const docxLabel = docxMap[template] ? docxMap[template] : 'Custom';
        docxEl.textContent = `DOCX: ${docxLabel}`;
      }
      applyTemplate(root, template);
      applyQuickStyles(root, data.settings);
      const pinfo = data.personalInfo || {};
      const useAsHeadline = !!pinfo.useAsHeadline;
      let headline = '';
      if (useAsHeadline) {
        // Primary: desired job position
        headline = pinfo['job-position'] || pinfo.jobPosition || '';
        // Fallback: first education degree ("Специальность") if job position is empty
        if (!headline && Array.isArray(data.education) && data.education.length) {
          const firstEdu = data.education[0] || {};
          headline = firstEdu.degree || '';
        }
      }
      // Update headline content and trigger subtle flash
      headlineEl.textContent = headline;
      if (headline && headlineEl) {
        headlineEl.classList.remove('headline-flash');
        // force reflow to restart animation
        void headlineEl.offsetWidth;
        headlineEl.classList.add('headline-flash');
      } else {
        headlineEl.classList.remove('headline-flash');
      }

      const nameParts = [pinfo['given-name'] || pinfo.givenName, pinfo['family-name'] || pinfo.familyName].filter(Boolean);
      if (['european', 'europass'].includes(template) && nameParts.length) {
        titleEl.innerHTML = nameParts.map(part => `<span class="cv-title-line">${part}</span>`).join('');
      } else {
        const fallbackTitle = data.title || nameParts.join(' ') || 'Моё резюме';
        titleEl.textContent = fallbackTitle;
      }

      if (pinfo.photo) {
        photoImg.src = pinfo.photo;
        photoWrap.classList.remove('hidden');
      } else {
        photoWrap.classList.add('hidden');
      }

      const summaryText = (data.additionalSections?.profile) || pinfo.summary || data.summary || '';
      if (summaryText) {
        summarySection.classList.remove('hidden');
        summaryContent.textContent = summaryText;
      } else {
        summarySection.classList.add('hidden');
        summaryContent.textContent = '';
      }

      const pf = document.getElementById('personalFields');
      pf.innerHTML = '';
      const contactFields = [
        ['Email', pinfo.email],
        ['Телефон', pinfo.phone],
        ['Локация', pinfo.address || pinfo.city],
        ['Сайт', pinfo.website],
        ['LinkedIn', pinfo.linkedin],
        ['Дата рождения', pinfo.birthdate]
      ];
      const hasContacts = contactFields.some(([_, value]) => !!value);
      document.getElementById('personalInfo').classList.toggle('hidden', !hasContacts);
      contactFields.forEach(([label, value]) => {
        if (!value) return;
        const el = document.createElement('div');
        el.className = 'text-sm';
        el.innerHTML = `<span class="muted">${label}:</span> <span>${value}</span>`;
        pf.appendChild(el);
      });

      const emp = Array.isArray(data.employment) ? data.employment : [];
      document.getElementById('employment').classList.toggle('hidden', emp.length === 0);
      const empList = document.getElementById('employmentList');
      empList.innerHTML = '';
      emp.forEach(item => {
        const wrapper = document.createElement('div');
        wrapper.className = 'space-y-1 border-b border-gray-100 pb-3 last:border-none last:pb-0';
        const period = [item.start_date || item.startDate, item.current ? 'по наст. время' : (item.end_date || item.endDate || '')].filter(Boolean).join(' — ');
        wrapper.innerHTML = `
          ${period ? `<div class=\"text-xs uppercase tracking-[0.3em] text-[var(--muted)]\">${period}</div>` : ''}
          <div class=\"font-semibold text-lg text-gray-900\">${item.position || ''}</div>
          <div class=\"text-sm text-gray-500\">${item.company || ''}</div>
          ${item.description ? `<div class=\"text-sm text-gray-700 leading-relaxed\">${item.description}</div>` : ''}
        `;
        empList.appendChild(wrapper);
      });

      const edu = Array.isArray(data.education) ? data.education : [];
      document.getElementById('education').classList.toggle('hidden', edu.length === 0);
      const eduList = document.getElementById('educationList');
      eduList.innerHTML = '';
      edu.forEach(item => {
        const years = [item.start_year || item.startYear, item.end_year || item.endYear].filter(Boolean).join(' — ');
        const block = document.createElement('div');
        block.className = 'space-y-1 border-b border-gray-100 pb-3 last:border-none last:pb-0';
        block.innerHTML = `
          ${years ? `<div class=\"text-xs uppercase tracking-[0.3em] text-[var(--muted)]\">${years}</div>` : ''}
          <div class=\"font-semibold text-lg text-gray-900\">${item.school || ''}</div>
          <div class=\"text-sm text-gray-500\">${[item.degree, item.level].filter(Boolean).join(' · ')}</div>
        `;
        eduList.appendChild(block);
      });

      const skills = Array.isArray(data.skills) ? data.skills : [];
      document.getElementById('skills').classList.toggle('hidden', skills.length === 0);
      const skillsList = document.getElementById('skillsList');
      skillsList.innerHTML = '';
      skills.forEach(item => {
        const pill = document.createElement('span');
        pill.className = 'chip';
        pill.textContent = `${item.skill || ''}${item.level ? ' · ' + item.level : ''}`;
        skillsList.appendChild(pill);
      });

      const langs = Array.isArray(data.languages) ? data.languages : [];
      document.getElementById('languages').classList.toggle('hidden', langs.length === 0);
      const languagesList = document.getElementById('languagesList');
      languagesList.innerHTML = '';
      langs.forEach(item => {
        const pill = document.createElement('span');
        pill.className = 'chip';
        pill.textContent = `${item.language || ''}${item.level ? ' · ' + item.level : ''}`;
        languagesList.appendChild(pill);
      });

      const add = data.additionalSections || {};
      const addRoot = document.getElementById('additional');
      const addCont = document.getElementById('additionalContent');
      addCont.innerHTML = '';
      const titleMap = {
        profile: 'Профиль',
        projects: 'Проекты',
        certificates: 'Сертификаты',
        courses: 'Курсы',
        internships: 'Стажировки',
        activities: 'Дополнительные виды деятельности',
        references: 'Рекомендации',
        qualities: 'Качества',
        achievements: 'Достижения',
        signature: 'Подпись',
        footer: 'Нижний колонтитул',
        assessment: 'Результаты теста',
        custom: 'Собственный раздел'
      };
      const entries = Object.entries(add).filter(([key, value]) => key !== 'profile' && !!value);
      if (entries.length) {
        addRoot.classList.remove('hidden');
        entries.forEach(([key, content]) => {
          const div = document.createElement('div');
          div.innerHTML = `<div class=\"text-sm font-semibold text-gray-700\">${titleMap[key] || key}</div><div class=\"text-sm text-gray-600 leading-relaxed\">${content}</div>`;
          addCont.appendChild(div);
        });
      } else {
        addRoot.classList.add('hidden');
      }
    }

    function persistTemplate(tpl) {
      try {
        const local = localStorage.getItem('cvBuilderData');
        const data = local ? JSON.parse(local) : {};
        data.template = tpl;
        localStorage.setItem('cvBuilderData', JSON.stringify(data));
      } catch (_) { }
    }

    document.addEventListener('DOMContentLoaded', () => {
      render();
      try {
        window.parent.postMessage({ type: 'cv-ready' }, window.location.origin);
      } catch (_) { }
      document.querySelectorAll('#tplPicker [data-tpl]').forEach(btn => {
        btn.addEventListener('click', () => {
          const tpl = btn.dataset.tpl;
          const root = document.getElementById('cvRoot');
          applyTemplate(root, tpl);
          document.getElementById('cvTemplate').textContent = tpl;
          persistTemplate(tpl);
          const data = getData();
          data.template = tpl;
          render(data);
        });
      });
      const applyBtn = document.getElementById('applyTplBtn');
      applyBtn.addEventListener('click', () => {
        const tpl = document.getElementById('cvTemplate').textContent;
        persistTemplate(tpl);
        applyBtn.classList.add('bg-green-50');
        setTimeout(() => applyBtn.classList.remove('bg-green-50'), 300);
      });
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script>
    // PNG export bridge
    window.addEventListener('message', async (event) => {
      const msg = event.data;
      if (!msg) return;
      if (msg.type === 'export-png') {
        try {
          const root = document.getElementById('cvRoot');
          const canvas = await html2canvas(root, { backgroundColor: null, scale: 2 });
          const dataUrl = canvas.toDataURL('image/png');
          window.parent.postMessage({ type: 'export-png-result', dataUrl }, window.location.origin);
        } catch (e) {
          window.parent.postMessage({ type: 'export-png-result', dataUrl: null, error: e?.message }, window.location.origin);
        }
      }
      if (msg.type === 'export-pdf') {
        try {
          const root = document.getElementById('cvRoot');
          const canvas = await html2canvas(root, { backgroundColor: '#ffffff', scale: 2 });
          const imgData = canvas.toDataURL('image/jpeg', 0.95);
          const { jsPDF } = window.jspdf || {};
          if (!jsPDF) throw new Error('jsPDF недоступен');
          const pdf = new jsPDF({ unit: 'pt', format: 'a4', orientation: 'portrait' });
          const pageWidth = pdf.internal.pageSize.getWidth();
          const pageHeight = pdf.internal.pageSize.getHeight();
          const scale = Math.min(pageWidth / canvas.width, pageHeight / canvas.height);
          const imgWidth = canvas.width * scale;
          const imgHeight = canvas.height * scale;
          const x = (pageWidth - imgWidth) / 2;
          const y = 32;
          pdf.addImage(imgData, 'JPEG', x, y, imgWidth, imgHeight);
          const blob = pdf.output('blob');
          const url = URL.createObjectURL(blob);
          window.parent.postMessage({ type: 'export-pdf-result', url }, window.location.origin);
        } catch (e) {
          window.parent.postMessage({ type: 'export-pdf-result', url: null, error: e?.message }, window.location.origin);
        }
      }
    });
  </script>
