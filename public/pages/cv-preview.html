<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Предварительный просмотр резюме</title>
  <link rel="stylesheet" href="/css/tailwind.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
    }

    .cv-card {
      background: var(--bg);
      border-radius: 1.5rem;
      padding: 2rem;
    }

    .cv-card::selection {
      background: rgba(37, 99, 235, .15);
    }

    .cv-body {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .cv-column {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .cv-left section,
    .cv-right section {
      padding: 0;
      border: none;
    }

    .cv-title {
      font-size: 2rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
    }

    .cv-title-line {
      display: block;
      line-height: 1.1;
    }

    .cv-header {
      background: var(--bg);
    }

    .section-head {
      text-transform: none;
      letter-spacing: normal;
    }

    .summary-text {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #475569;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      font-size: 0.85rem;
      margin-right: 0.4rem;
      margin-bottom: 0.4rem;
      background: var(--chip-bg);
      border: 1px solid var(--chip-bd);
    }

    .cv-left,
    .cv-right {
      width: 100%;
    }

    .tpl-modern {
      --accent: #2563eb;
      --bg: #ffffff;
      --muted: #6b7280;
      --chip-bg: rgba(37, 99, 235, .08);
      --chip-bd: #bfdbfe;
    }

    .tpl-classic {
      --accent: #111827;
      --bg: #ffffff;
      --muted: #4b5563;
      --chip-bg: #f3f4f6;
      --chip-bd: #e5e7eb;
    }

    .tpl-minimal {
      --accent: #374151;
      --bg: #ffffff;
      --muted: #9ca3af;
      --chip-bg: #ffffff;
      --chip-bd: #e5e7eb;
    }

    /* Уточнения под PDF-примеры для классического/минимального */
    .tpl-classic .cv-header {
      padding-bottom: 0.25rem;
    }

    .tpl-classic .cv-title {
      font-size: 36px;
      letter-spacing: -0.015em;
    }

    .tpl-minimal .cv-header {
      padding-bottom: 0.25rem;
    }

    .tpl-minimal .cv-title {
      font-size: 34px;
      letter-spacing: 0;
    }

    .tpl-minimal .section-head,
    .tpl-classic .section-head {
      text-transform: none;
      letter-spacing: 0;
    }

    .tpl-creative {
      --accent: #7c3aed;
      --bg: #ffffff;
      --muted: #6b7280;
      --chip-bg: rgba(124, 58, 237, .08);
      --chip-bd: #c4b5fd;
    }

    .tpl-european {
      --accent: #2f47a3;
      --bg: #ffffff;
      --muted: #7c88b0;
      --chip-bg: rgba(47, 71, 163, .08);
      --chip-bd: #c7cefb;
    }

    .tpl-europass {
      --accent: #1f3c88;
      --bg: #ffffff;
      --muted: #647099;
      --chip-bg: rgba(31, 60, 136, .08);
      --chip-bd: #cfd6ff;
    }

    /* Чистый лист - пустой белый холст */
    .tpl-blank {
      --accent: #374151;
      --bg: #ffffff;
      --muted: #9ca3af;
      --chip-bg: #ffffff;
      --chip-bd: #e5e7eb;
      min-height: 842px;
      /* A4 height */
      background: #ffffff;
      border-radius: 0 !important;
      box-shadow: none !important;
      padding: 0 !important;
    }

    .tpl-blank .cv-header,
    .tpl-blank .cv-body {
      display: none !important;
    }

    /* Быстрые цветовые схемы (поверх шаблона) */
    .theme-blue {
      --accent: #2563eb;
      --chip-bg: rgba(37, 99, 235, .08);
      --chip-bd: #bfdbfe;
    }

    .theme-emerald {
      --accent: #059669;
      --chip-bg: rgba(5, 150, 105, .08);
      --chip-bd: #a7f3d0;
    }

    .theme-rose {
      --accent: #e11d48;
      --chip-bg: rgba(225, 29, 72, .08);
      --chip-bd: #fecdd3;
    }

    /* Размер текста */
    .font-small {
      font-size: 14px;
    }

    .font-medium {
      font-size: 16px;
    }

    .font-large {
      font-size: 18px;
    }

    .tpl-european .cv-body {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 2.25rem;
    }

    .tpl-european .cv-left {
      background: #f4f6ff;
      border-radius: 1.5rem;
      padding: 1.75rem;
      box-shadow: inset 0 0 0 1px rgba(99, 102, 241, .08);
    }

    .tpl-european .cv-header {
      margin-bottom: 0.5rem;
      padding-bottom: 0;
    }

    .tpl-european .cv-title {
      font-size: 42px;
      letter-spacing: -0.03em;
    }

    .tpl-european .cv-title-line+.cv-title-line {
      margin-top: -0.35rem;
    }

    .tpl-european #cvPhotoWrap {
      width: 96px;
      height: 96px;
      border: 4px solid #fff;
      box-shadow: 0 12px 30px rgba(47, 71, 163, .25);
    }

    .tpl-european .section-head {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #94a3b8;
    }

    .tpl-european #personalFields .muted {
      color: #94a3b8;
    }

    .tpl-european #skillsList,
    .tpl-european #languagesList {
      display: block;
    }

    .tpl-europass .cv-body {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 2.5rem;
    }

    .tpl-europass .cv-left {
      background: linear-gradient(180deg, #f7f9ff 0%, #eef1ff 100%);
      border-radius: 1.75rem;
      padding: 1.8rem;
      box-shadow: inset 0 0 0 1px rgba(31, 60, 136, .12);
    }

    .tpl-europass .cv-right {
      position: relative;
      padding-left: 2rem;
    }

    .tpl-europass .cv-right::before {
      content: '';
      position: absolute;
      left: 0.6rem;
      top: 0.75rem;
      bottom: 0.75rem;
      width: 2px;
      background: rgba(31, 60, 136, .25);
    }

    .tpl-europass .cv-title {
      font-size: 40px;
      letter-spacing: -0.025em;
    }

    .tpl-europass .cv-title-line+.cv-title-line {
      margin-top: -0.25rem;
    }

    .tpl-europass #cvPhotoWrap {
      width: 110px;
      height: 110px;
      border: 5px solid #fff;
      box-shadow: 0 16px 35px rgba(15, 23, 42, .25);
    }

    .tpl-europass .section-head {
      font-size: 0.78rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #95a3c5;
    }

    .tpl-europass #employmentList>div,
    .tpl-europass #educationList>div {
      position: relative;
      padding-left: 1.5rem;
      border: none;
      margin-bottom: 1.75rem;
    }

    .tpl-europass #employmentList>div:last-child,
    .tpl-europass #educationList>div:last-child {
      margin-bottom: 0;
    }

    .tpl-europass #employmentList>div::before,
    .tpl-europass #educationList>div::before {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 999px;
      border: 2px solid #fff;
      background: var(--accent);
      left: -0.95rem;
      top: 0.25rem;
      box-shadow: 0 4px 12px rgba(15, 23, 42, .18);
    }

    @media (max-width: 1023px) {
      .tpl-european .cv-body {
        grid-template-columns: 1fr;
      }

      .tpl-european .cv-left {
        order: 1;
      }

      .tpl-european .cv-right {
        order: 2;
      }

      .tpl-europass .cv-body {
        grid-template-columns: 1fr;
      }

      .tpl-europass .cv-right {
        padding-left: 0;
      }

      .tpl-europass .cv-right::before {
        display: none;
      }
    }

    /* Subtle flash when headline appears/updates */
    .headline-flash {
      animation: headlineFade 900ms ease-out;
      display: inline-block;
      padding: 2px 6px;
      border-radius: 6px;
    }

    @keyframes headlineFade {
      0% {
        background: rgba(59, 130, 246, 0.20);
      }

      50% {
        background: rgba(59, 130, 246, 0.10);
      }

      100% {
        background: transparent;
      }
    }

    /* Canva-style editable elements */
    .cv-element-editable {
      position: relative;
      transition: outline 0.15s ease, box-shadow 0.15s ease;
    }

    .cv-element-inner {
      width: 100%;
      height: 100%;
      transform-origin: top left;
    }

    .cv-element-editable:hover {
      outline: 2px solid #8b5cf6;
      outline-offset: 2px;
    }

    .cv-element-editable:focus-within {
      outline: 2px solid #3b82f6;
      outline-offset: 2px;
    }

    .cv-element-editable [contenteditable="true"]:focus {
      outline: none;
      background: rgba(59, 130, 246, 0.05);
    }

    .cv-element-delete {
      opacity: 0;
      transition: opacity 0.15s;
    }

    .cv-element-editable:hover .cv-element-delete {
      opacity: 1;
    }

    /* Drag handle for text blocks and other elements */
    .cv-drag-handle {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 6px;
      border-radius: 9999px;
      background: rgba(15, 23, 42, 0.65);
      cursor: move;
      opacity: 0;
      transition: opacity 0.15s ease, background 0.15s ease;
      z-index: 25;
    }

    .cv-element-editable:hover .cv-drag-handle,
    .cv-element-selected .cv-drag-handle {
      opacity: 1;
    }

    .cv-drag-handle:hover {
      background: rgba(59, 130, 246, 0.9);
    }

    /* Draggable elements */
    .cv-element-draggable {
      cursor: move;
      touch-action: none;
    }

    .cv-element-draggable:active {
      cursor: grabbing;
    }

    .cv-element-draggable [contenteditable="true"] {
      cursor: text;
    }

    /* Animation for added elements */
    @keyframes elementAdded {
      0% {
        opacity: 0;
        transform: scale(0.9);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .cv-element-editable {
      animation: elementAdded 0.2s ease-out;
    }

    /* Canvas container for absolute positioning */
    #cvRoot {
      position: relative;
      min-height: 842px;
    }

    /* Resize handles */
    .cv-element-selected {
      outline: 2px solid #3b82f6 !important;
      outline-offset: 0 !important;
    }

    .resize-handle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #fff;
      border: 2px solid #3b82f6;
      border-radius: 2px;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }

    .cv-element-selected .resize-handle {
      opacity: 1;
      pointer-events: auto;
    }

    .resize-handle:hover {
      background: #3b82f6;
    }

    /* Corner handles */
    .resize-handle.top-left {
      top: -5px;
      left: -5px;
      cursor: nwse-resize;
    }

    .resize-handle.top-right {
      top: -5px;
      right: -5px;
      cursor: nesw-resize;
    }

    .resize-handle.bottom-left {
      bottom: -5px;
      left: -5px;
      cursor: nesw-resize;
    }

    .resize-handle.bottom-right {
      bottom: -5px;
      right: -5px;
      cursor: nwse-resize;
    }

    /* Edge handles */
    .resize-handle.top-center {
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      cursor: ns-resize;
    }

    .resize-handle.bottom-center {
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      cursor: ns-resize;
    }

    .resize-handle.left-center {
      top: 50%;
      left: -5px;
      transform: translateY(-50%);
      cursor: ew-resize;
    }

    .resize-handle.right-center {
      top: 50%;
      right: -5px;
      transform: translateY(-50%);
      cursor: ew-resize;
    }
  </style>
</head>

<body class="bg-gray-50">
  <script>
    // Tailwind CDN fallback: гарантируем стили превью при любых сбоях
    (function () {
      if (!document.getElementById('tw-cdn-fallback')) {
        const s = document.createElement('script');
        s.id = 'tw-cdn-fallback';
        s.src = 'https://cdn.tailwindcss.com';
        document.head.appendChild(s);
        console.warn('Tailwind CSS: CDN fallback загружен (preview)');
      }
    })();
  </script>
  <div class="max-w-4xl mx-auto p-6">
    <div id="docxNotice" class="hidden bg-yellow-50 border border-yellow-200 text-yellow-900 rounded-lg p-4 mb-4">
      <div class="font-semibold mb-1">Предпросмотр DOCX недоступен в браузере.</div>
      <div class="text-sm">Вы можете <a id="docxDownload" href="#" class="underline text-yellow-900">скачать шаблон</a>
        и открыть его в редакторе документов.</div>
    </div>
    <div class="flex flex-wrap items-center justify-between mb-4 gap-3">
      <div class="text-sm text-gray-500">Выберите шаблон:</div>
      <div class="flex flex-wrap gap-2" id="tplPicker">
        <button type="button" data-tpl="modern" class="px-3 py-1 text-sm rounded border">Современный</button>
        <button type="button" data-tpl="classic" class="px-3 py-1 text-sm rounded border">Классический</button>
        <button type="button" data-tpl="minimal" class="px-3 py-1 text-sm rounded border">Минималистичный</button>
        <button type="button" data-tpl="creative" class="px-3 py-1 text-sm rounded border">Креативный</button>
        <button type="button" data-tpl="european" class="px-3 py-1 text-sm rounded border">Европейский</button>
        <button type="button" data-tpl="europass" class="px-3 py-1 text-sm rounded border">Europass</button>
      </div>
    </div>

    <div id="cvRoot" class="cv-card shadow rounded-lg tpl-modern theme-blue font-medium">
      <div class="cv-header p-4 -mx-4 -mt-4 mb-3 rounded">
        <div class="flex flex-wrap items-center justify-between gap-4">
          <div>
            <div id="cvHeadline" class="text-xs uppercase tracking-[0.3em] text-gray-400"></div>
            <h1 id="cvTitle" class="cv-title mt-1">Моё резюме</h1>
          </div>
          <div class="flex items-center gap-3">
            <span id="cvTemplate" class="text-xs px-2 py-1 rounded border bg-white/70">modern</span>
            <span id="cvDocx" class="text-xs px-2 py-1 rounded border bg-white/70">DOCX: Custom</span>
            <div id="cvPhotoWrap" class="w-20 h-20 overflow-hidden border hidden">
              <img id="cvPhoto" alt="photo" class="w-full h-full object-cover" />
            </div>
          </div>
        </div>
      </div>

      <div class="cv-body">
        <div class="cv-left">
          <section id="summary" class="hidden">
            <h2 class="section-head text-sm font-semibold text-gray-500">Профиль</h2>
            <p id="summaryContent" class="summary-text mt-2"></p>
          </section>

          <section id="personalInfo" class="hidden">
            <h2 class="section-head text-lg font-semibold accent">Контакты</h2>
            <div id="personalFields" class="mt-2 grid grid-cols-1 gap-2"></div>
          </section>

          <section id="skills" class="hidden">
            <h2 class="section-head text-lg font-semibold accent">Навыки</h2>
            <div id="skillsList" class="mt-2"></div>
          </section>

          <section id="languages" class="hidden">
            <h2 class="section-head text-lg font-semibold accent">Языки</h2>
            <div id="languagesList" class="mt-2"></div>
          </section>
        </div>

        <div class="cv-right">
          <section id="employment" class="hidden">
            <h2 class="section-head text-lg font-semibold accent">Опыт работы</h2>
            <div id="employmentList" class="mt-2 space-y-4"></div>
          </section>

          <section id="education" class="hidden">
            <h2 class="section-head text-lg font-semibold accent">Образование</h2>
            <div id="educationList" class="mt-2 space-y-4"></div>
          </section>

          <section id="additional" class="hidden">
            <h2 class="section-head text-lg font-semibold accent">Дополнительно</h2>
            <div id="additionalContent" class="mt-2 space-y-3"></div>
          </section>
        </div>
      </div>

      <div class="mt-6 flex flex-wrap gap-3">
        <a href="/pages/pdf-converter"
          class="inline-flex items-center px-4 py-2 rounded bg-blue-600 text-white">Редактировать</a>
        <button id="applyTplBtn" class="inline-flex items-center px-4 py-2 rounded border">Применить шаблон</button>
      </div>
    </div>
  </div>

  <script>
    // Если пришёл docx в query, показываем понятную заглушку
    (function () {
      try {
        const url = new URL(window.location.href);
        const docx = url.searchParams.get('docx');
        if (docx) {
          document.getElementById('tplPicker').classList.add('hidden');
          document.getElementById('applyTplBtn').classList.add('hidden');
          document.getElementById('cvRoot').classList.add('hidden');
          const n = document.getElementById('docxNotice');
          const a = document.getElementById('docxDownload');
          a.href = docx;
          n.classList.remove('hidden');
        }
      } catch (_) { }
    })();
    function getData() {
      try {
        const url = new URL(window.location.href);
        const raw = url.searchParams.get('data');
        if (raw) return JSON.parse(decodeURIComponent(raw));
        // fallback: если передан template в query, используем его до postMessage
        const tpl = url.searchParams.get('template');
        if (tpl) {
          // Для blank - возвращаем пустые данные (чистый лист)
          if (tpl === 'blank') {
            return { template: 'blank' };
          }
          const local = localStorage.getItem('cvBuilderData');
          const base = local ? JSON.parse(local) : {};
          base.template = tpl;
          return base;
        }
      } catch (_) { }
      try {
        const local = localStorage.getItem('cvBuilderData');
        if (local) return JSON.parse(local);
      } catch (_) { }
      return {};
    }

    function applyTemplate(root, template) {
      root.classList.remove('tpl-modern', 'tpl-classic', 'tpl-minimal', 'tpl-creative', 'tpl-european', 'tpl-europass', 'tpl-blank');
      const map = { modern: 'tpl-modern', classic: 'tpl-classic', minimal: 'tpl-minimal', creative: 'tpl-creative', european: 'tpl-european', europass: 'tpl-europass', blank: 'tpl-blank' };
      root.classList.add(map[template] || 'tpl-modern');
      // Форма фото согласно шаблону (квадрат/прямоугольник для PDF-примеров)
      try {
        const wrap = document.getElementById('cvPhotoWrap');
        if (wrap) {
          if (template === 'classic' || template === 'minimal') {
            wrap.classList.remove('rounded-full');
            wrap.classList.add('rounded');
          } else {
            wrap.classList.remove('rounded');
            wrap.classList.add('rounded-full');
          }
        }
      } catch (_) { }
      document.querySelectorAll('#tplPicker [data-tpl]').forEach(btn => {
        if (btn.dataset.tpl === template) {
          btn.classList.add('border-blue-400', 'ring-2', 'ring-blue-200');
        } else {
          btn.classList.remove('border-blue-400', 'ring-2', 'ring-blue-200');
        }
      });
    }

    function applyQuickStyles(root, settings) {
      const color = (settings && settings.colorScheme) || 'blue';
      const size = (settings && settings.fontSize) || 'medium';
      root.classList.remove('theme-blue', 'theme-emerald', 'theme-rose', 'font-small', 'font-medium', 'font-large');
      root.classList.add(`theme-${color}`);
      root.classList.add(`font-${size}`);
    }

    function render(dataOverride) {
      if (!window.__cvPreviewListenerAttached) {
        window.addEventListener('message', (event) => {
          const payload = event.data;
          if (!payload || payload.type !== 'cv-data') return;
          render(payload.payload || {});
        });
        window.__cvPreviewListenerAttached = true;
      }
      const data = dataOverride || getData();
      const template = data.template || 'modern';
      const root = document.getElementById('cvRoot');
      const titleEl = document.getElementById('cvTitle');
      const tplEl = document.getElementById('cvTemplate');
      const docxEl = document.getElementById('cvDocx');
      const headlineEl = document.getElementById('cvHeadline');
      const photoWrap = document.getElementById('cvPhotoWrap');
      const photoImg = document.getElementById('cvPhoto');
      const summarySection = document.getElementById('summary');
      const summaryContent = document.getElementById('summaryContent');

      tplEl.textContent = template;

      // For blank template, hide picker and show only the white canvas
      const picker = document.getElementById('tplPicker');
      const pickerLabel = picker?.previousElementSibling;
      if (template === 'blank') {
        picker?.classList.add('hidden');
        pickerLabel?.classList.add('hidden');
        tplEl?.classList.add('hidden');
        docxEl?.classList.add('hidden');
        root.classList.remove('shadow', 'rounded-lg');
      } else {
        picker?.classList.remove('hidden');
        pickerLabel?.classList.remove('hidden');
        tplEl?.classList.remove('hidden');
        docxEl?.classList.remove('hidden');
        root.classList.add('shadow', 'rounded-lg');
      }

      // Show mapped DOCX variant for clarity
      if (docxEl) {
        const docxMap = { classic: 'Experienced', minimal: 'Entry-level' };
        const docxLabel = docxMap[template] ? docxMap[template] : 'Custom';
        docxEl.textContent = `DOCX: ${docxLabel}`;
      }
      applyTemplate(root, template);
      applyQuickStyles(root, data.settings);
      const pinfo = data.personalInfo || {};
      const useAsHeadline = !!pinfo.useAsHeadline;
      let headline = '';
      if (useAsHeadline) {

        'icon-arrow': () => createEditableElement('icon', '<svg viewBox="0 0 24 24" fill="#3b82f6" width="40" height="40"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8-8-8z"/></svg>'),

        // Заголовки
        'heading-h1': () => {
          return createEditableElement('heading', '<h1 contenteditable="true" style="font-size: 28px; font-weight: bold; margin: 0; padding: 8px; min-width: 150px; background: transparent;">Заголовок</h1>');
        },
        'heading-h2': () => {
          return createEditableElement('heading', '<h2 contenteditable="true" style="font-size: 22px; font-weight: 600; margin: 0; padding: 6px; min-width: 120px; background: transparent;">Подзаголовок</h2>');
        },
        'heading-h3': () => {
          return createEditableElement('heading', '<h3 contenteditable="true" style="font-size: 18px; font-weight: 500; margin: 0; padding: 4px; min-width: 100px; background: transparent;">Малый заголовок</h3>');
        },

        // Текстовые блоки
        'paragraph': () => {
          return createEditableElement('paragraph', '<p contenteditable="true" style="font-size: 14px; line-height: 1.6; margin: 0; padding: 8px; min-width: 200px; max-width: 400px; background: transparent;">Введите текст здесь. Нажмите дважды для редактирования.</p>');
        },
        'list-bullet': () => {
          return createEditableElement('list', `
            <ul contenteditable="true" style="font-size: 14px; line-height: 1.8; margin: 0; padding: 8px 8px 8px 32px; min-width: 180px; background: transparent;">
              <li>Пункт 1</li>
              <li>Пункт 2</li>
              <li>Пункт 3</li>
            </ul>
          `);
        },
        'list-number': () => {
          return createEditableElement('list', `
            <ol contenteditable="true" style="font-size: 14px; line-height: 1.8; margin: 0; padding: 8px 8px 8px 32px; min-width: 180px; background: transparent;">
              <li>Первый пункт</li>
              <li>Второй пункт</li>
              <li>Третий пункт</li>
            </ol>
          `);
        },

        // Фигуры
        'shape-rect': () => createEditableElement('shape', '<div style="width: 120px; height: 70px; background: #e5e7eb; border: 2px solid #9ca3af; border-radius: 4px;"></div>'),
        'shape-circle': () => createEditableElement('shape', '<div style="width: 80px; height: 80px; background: #e5e7eb; border: 2px solid #9ca3af; border-radius: 50%;"></div>'),
        'shape-rounded': () => createEditableElement('shape', '<div style="width: 120px; height: 70px; background: #e5e7eb; border: 2px solid #9ca3af; border-radius: 20px;"></div>'),
        'shape-square': () => createEditableElement('shape', '<div style="width: 80px; height: 80px; background: #e5e7eb; border: 2px solid #9ca3af; border-radius: 4px;"></div>'),
        'shape-triangle': () => createEditableElement('shape', '<div style="width: 0; height: 0; border-left: 50px solid transparent; border-right: 50px solid transparent; border-bottom: 86px solid #9ca3af;"></div>'),
        'shape-diamond': () => createEditableElement('shape', '<div style="width: 70px; height: 70px; background: #9ca3af; transform: rotate(45deg);"></div>'),

        // Изображения placeholder
        'photo-placeholder': () => createEditableElement('image', `
          <div style="width: 120px; height: 120px; background: #f3f4f6; border: 2px dashed #9ca3af; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
            <svg viewBox="0 0 24 24" fill="#9ca3af" width="48" height="48"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4.418 0-8 2.239-8 5v1h16v-1c0-2.761-3.582-5-8-5z"/></svg>
          </div>
        `),
        'logo-placeholder': () => createEditableElement('image', `
          <div style="width: 100px; height: 100px; background: #f3f4f6; border: 2px dashed #9ca3af; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
            <svg viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" width="40" height="40"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
          </div>
        `),

        // Таблицы
        'table-2x2': () => createEditableElement('table', createTable(2, 2)),
        'table-3x2': () => createEditableElement('table', createTable(3, 2)),
        'table-2x3': () => createEditableElement('table', createTable(2, 3)),
        'table-3x3': () => createEditableElement('table', createTable(3, 3))
      };

      function createTable(cols, rows) {
        let html = '<table style="border-collapse: collapse; font-size: 12px; background: white;">';
        for (let r = 0; r < rows; r++) {
          html += '<tr>';
          for (let c = 0; c < cols; c++) {
            html += `<td contenteditable="true" style="border: 1px solid #d1d5db; padding: 10px 16px; min-width: 80px;">Ячейка</td>`;
          }
          html += '</tr>';
        }
        html += '</table>';
        return html;
      }

      // Счётчик для смещения новых элементов
      let addCounter = 0;

      function addElement(type) {
        ensureCanvasReady();

        const root = document.getElementById('cvRoot');
        if (!root) return;

        const template = elementTemplates[type];
        if (!template) {
          console.warn('Unknown element type:', type);
          return;
        }

        const element = template();

        // Добавить смещение для каждого нового элемента чтобы они не накладывались
        addCounter++;
        const offsetX = 50 + (addCounter % 5) * 30;
        const offsetY = 50 + (addCounter % 8) * 25;
        element.style.left = offsetX + 'px';
        element.style.top = offsetY + 'px';

        // Добавить прямо в cvRoot (canvas)
        root.appendChild(element);

        // Визуальная подсказка о добавлении
        element.style.transform = 'scale(0.8)';
        element.style.opacity = '0';
        requestAnimationFrame(() => {
          element.style.transition = 'transform 0.2s ease-out, opacity 0.2s ease-out';
          element.style.transform = 'scale(1)';
          element.style.opacity = '1';
        });
      }

      function addImage(dataUrl) {
        ensureCanvasReady();

        const root = document.getElementById('cvRoot');
        if (!root) return;

        const wrapper = createEditableElement('image', `
          <img src="${dataUrl}" alt="Uploaded image" style="max-width: 300px; max-height: 300px; display: block; border-radius: 4px;">
        `);

        addCounter++;
        wrapper.style.left = (60 + (addCounter % 4) * 40) + 'px';
        wrapper.style.top = (60 + (addCounter % 6) * 30) + 'px';

        root.appendChild(wrapper);
      }

      // Слушатель сообщений от родительского окна
      window.addEventListener('message', (event) => {
        const msg = event.data;
        if (!msg) return;

        if (msg.type === 'addElement') {
          addElement(msg.element);
        }

        if (msg.type === 'addImage') {
          addImage(msg.imageData);
        }
      });

      // Инициализация при загрузке
      document.addEventListener('DOMContentLoaded', ensureCanvasReady);
    })();
  </script>
  <script>
    // PNG export bridge
    window.addEventListener('message', async (event) => {
      const msg = event.data;
      if (!msg) return;
      if (msg.type === 'export-png') {
        try {
          const root = document.getElementById('cvRoot');
          const canvas = await html2canvas(root, { backgroundColor: null, scale: 2 });
          const dataUrl = canvas.toDataURL('image/png');
          window.parent.postMessage({ type: 'export-png-result', dataUrl }, window.location.origin);
        } catch (e) {
          window.parent.postMessage({ type: 'export-png-result', dataUrl: null, error: e?.message }, window.location.origin);
        }
      }
      if (msg.type === 'export-pdf') {
        try {
          const root = document.getElementById('cvRoot');
          const canvas = await html2canvas(root, { backgroundColor: '#ffffff', scale: 2 });
          const imgData = canvas.toDataURL('image/jpeg', 0.95);
          const { jsPDF } = window.jspdf || {};
          if (!jsPDF) throw new Error('jsPDF недоступен');
          const pdf = new jsPDF({ unit: 'pt', format: 'a4', orientation: 'portrait' });
          const pageWidth = pdf.internal.pageSize.getWidth();
          const pageHeight = pdf.internal.pageSize.getHeight();
          const scale = Math.min(pageWidth / canvas.width, pageHeight / canvas.height);
          const imgWidth = canvas.width * scale;
          const imgHeight = canvas.height * scale;
          const x = (pageWidth - imgWidth) / 2;
          const y = 32;
          pdf.addImage(imgData, 'JPEG', x, y, imgWidth, imgHeight);
          const blob = pdf.output('blob');
          const url = URL.createObjectURL(blob);
          window.parent.postMessage({ type: 'export-pdf-result', url }, window.location.origin);
        } catch (e) {
          window.parent.postMessage({ type: 'export-pdf-result', url: null, error: e?.message }, window.location.origin);
        }
      }
    });
  </script>
